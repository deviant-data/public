<!doctype html><html lang="en"><meta charset="utf-8">
<title>StreamLearn source evidence</title>
<style>body{font:16px system-ui;background:#10151c;color:#e6edf3;margin:2rem}a{color:#84caff}button{font:inherit;margin:.5rem;padding:.4rem}table{border-collapse:collapse;width:100%}td,th{text-align:left;border-bottom:1px solid #344154;padding:.6rem;overflow-wrap:anywhere}th{color:#84caff}</style>
<a href="../pages/overview.html">Back to this learning epoch</a><h1>Source evidence</h1>
<p id="status">Checking the pinned provenance index…</p><button id="previous">Previous page</button><button id="next">Next page</button>
<table><thead><tr><th>Source</th><th>External identifier</th><th>Revision</th><th>Source time</th></tr></thead><tbody id="rows"></tbody></table>
<script>
(async()=>{
const status=document.getElementById('status'),rows=document.getElementById('rows');
async function hash(bytes){return Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',bytes))).map(x=>x.toString(16).padStart(2,'0')).join('')}
async function checked(path,expected){const response=await fetch(path,{cache:'no-store'});if(!response.ok)throw Error('unavailable');const bytes=await response.arrayBuffer();if(await hash(bytes)!==expected)throw Error('integrity mismatch');return JSON.parse(new TextDecoder().decode(bytes))}
try{const index=await checked('index.json','9a1d54681741fbf3e690f3118f0ed139ea7e8cf3e8b74f39df6522000df06838');let selected=0;
async function show(){rows.replaceChildren();document.getElementById('previous').disabled=selected===0;document.getElementById('next').disabled=selected+1>=index.pages.length;
try{const page=index.pages[selected];if(!page){status.textContent='No source references in this epoch.';return}if(!/^[a-f0-9]{64}\.json$/.test(page.path))throw Error('invalid page');
const value=await checked(page.path,page.sha256),refs=value.refs;if(value.page_id!==page.page_id||refs.length!==page.member_count||refs.length>256)throw Error('membership mismatch');
const identities=refs.map(r=>({source_object_id:r.source_object_id,source_revision_id:r.source_revision_id}));if(await hash(new TextEncoder().encode(JSON.stringify(identities)))!==page.page_id)throw Error('membership integrity');
status.textContent='Page '+(selected+1)+' of '+index.pages.length+' · '+index.total_revisions+' exact revisions · metadata only. Identity does not establish independent evidence.';
for(const ref of refs){const row=document.createElement('tr');for(const field of ['source_name','external_id','source_revision_id','source_ts']){const cell=document.createElement('td');cell.textContent=ref[field]||'';row.append(cell)}rows.append(row)}
}catch(e){status.textContent='This source evidence page is unavailable or failed verification. The learning epoch is unchanged.'}}
document.getElementById('previous').onclick=()=>{if(selected>0){selected--;show()}};document.getElementById('next').onclick=()=>{if(selected+1<index.pages.length){selected++;show()}};await show();
}catch(e){status.textContent='The provenance index is unavailable or failed verification.'}
})();
</script></html>
